            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.14);
            --shadow-elevated: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.96);
            --accent-gold: #d97706;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-glass: rgba(0, 0, 0, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background: var(--bg-base); color: var(--text-main);
            font-family: Tahoma, sans-serif; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f6c2e; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .splash-container {
            width: 100%; max-width: 480px; padding: 40px 25px;
            text-align: center; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #ffffff;
        }
        .logo-box {
            width: 140px; height: 140px; background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffd700; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); padding: 15px;
        }
        .logo-box svg { width: 100%; height: 100%; fill: #ffd700; }
        .splash-container h1 {
            font-size: 28px; font-weight: 700; margin-bottom: 12px; color: #ffd700;
        }
        .subtitle {
            font-size: 15px; color: #ffffff; margin-bottom: 40px; line-height: 1.8;
        }
        .buttons-container {
            display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 340px;
        }
        .splash-btn {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff; padding: 16px 20px; font-size: 18px; font-weight: 600;
            border-radius: 50px; cursor: pointer; transition: all 0.3s ease;
        }
        .splash-btn:hover {
            background: #ffd700; color: #0f6c2e; border-color: #ffd700;
        }
        .footer-text { margin-top: 50px; font-size: 13px; color: rgba(255, 255, 255, 0.6); }

        #gisAppContainer {
            display: none; width: 100%; height: 100%; position: relative;
        }
        .gis-platform-container {
            position: relative; width: 100vw; height: 100vh;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .map-viewport {
            position: relative; width: 100%; height: 100%; cursor: grab; overflow: hidden; touch-action: none;
        }
        .map-viewport:active { cursor: grabbing; }
        .map-canvas {
            position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; width: 2400px; height: 1600px;
        }
        .map-canvas img { display: block; width: 100%; height: 100%; pointer-events: none; }

        .hotspot {
            position: absolute; width: 38px; height: 38px;
            background: rgba(245, 158, 11, 0.92); border: 3px solid #fff;
            border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #fff; z-index: 100;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.7);
        }
        .hotspot.active { background: var(--accent-green) !important; transform: translate(-50%, -50%) scale(1.4); }

        .sub-hotspot {
            position: absolute; width: 30px; height: 30px;
            background: rgba(59, 130, 246, 0.92); border: 2px solid #fff;
            border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #fff; z-index: 100;
        }
        .sub-hotspot.wc { background: rgba(239, 68, 68, 0.92); }
        .sub-hotspot.active { background: var(--accent-green) !important; }

        #userLocationPin {
            position: absolute; width: 36px; height: 36px;
            background: var(--accent-blue); border: 3px solid #fff;
            border-radius: 50%; transform: translate(-50%, -50%);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }

        .gis-topbar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 300; pointer-events: none; gap: 10px;
        }
        .toolbar-group { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; align-items: center; }
        .gis-btn {
            background: var(--bg-card); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); color: var(--text-main);
            padding: 8px 12px; border-radius: 10px; font-weight: bold;
            font-size: 11px; cursor: pointer; box-shadow: var(--shadow-elevated);
        }
        .gis-btn:hover { background: var(--accent-gold); color: #020617; }
        .gis-btn.active-lang { background: var(--accent-gold); color: #020617; }
        .gps-btn { background: var(--accent-blue); color: #fff; border: none; }
        .back-home-btn { background: #ef4444; color: #fff; border: none; }
        .view-switch-btn { background: #8b5cf6; color: #fff; border: none; }

        .zoom-controls {
            position: absolute; bottom: 25px; right: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 300;
        }
        .zoom-btn {
            width: 44px; height: 44px; background: var(--bg-card);
            border: 1px solid var(--border-glass); color: var(--text-main);
            font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .gis-sidebar {
            position: absolute; top: 0; right: -440px; width: 420px; height: 100%;
            background: var(--bg-card); backdrop-filter: blur(24px);
            border-left: 1px solid var(--border-glass); display: flex;
            flex-direction: column; z-index: 500; transition: right 0.4s ease; pointer-events: auto;
        }
        .gis-sidebar.open { right: 0; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; }

        .close-btn { background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; }
        .search-container { padding: 15px 20px; }
        .search-input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); padding: 12px; border-radius: 12px; color: var(--text-main); outline: none; }
        .records-list { flex: 1; overflow-y: auto; padding: 0 15px 20px 15px; }
        .record-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-glass); padding: 14px; border-radius: 14px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 14px; }

        function startApp(lang) {
            const splash = document.getElementById('splashScreen');
            const app = document.getElementById('gisAppContainer');

            buildHotspotsForCurrentView();
            requestAnimationFrame(initView);
        }

        function goToSplash() {
            document.getElementById('gisAppContainer').style.display = 'none';
            document.getElementById('splashScreen').style.display = 'flex';
        }

        function changeLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
            document.documentElement.setAttribute('lang', lang);

            document.getElementById('btnGps').textContent = t.myLocation;
            document.getElementById('txtMenuList').textContent = t.menuList;
            document.getElementById('txtBackHome').textContent = t.backHome;
            document.getElementById('txtSwitchView').textContent = t.switchView;
            document.getElementById('sidebarTitle').textContent = t.title;
            document.getElementById('gisSearchInput').placeholder = t.searchPlaceholder;
            document.getElementById('txtGuideLabel').textContent = t.guideLabel;
            document.getElementById('btnAudio').textContent = t.audioBtn;

            document.querySelectorAll('.toolbar-group .gis-btn[id^="lang"]').forEach(b => b.classList.remove('active-lang'));
            const langBtn = document.getElementById('lang' + lang.charAt(0).toUpperCase() + lang.slice(1));
            if(langBtn) langBtn.classList.add('active-lang');

            renderRecords(database);
        }

        const viewport = document.getElementById('mapViewport');
        const canvas = document.getElementById('mapCanvas');
        const mainMapImg = document.getElementById('mainMapImg');
        const hotspotsContainer = document.getElementById('hotspotsContainer');
        const userPin = document.getElementById('userLocationPin');
        const hudPanel = document.getElementById('hudPanel');
        const hudTitle = document.getElementById('hudTitle');
        const hudDescription = document.getElementById('hudDescription');
        const gisRecordsList = document.getElementById('gisRecordsList');
        const gisSearchInput = document.getElementById('gisSearchInput');
        const gisSidebar = document.getElementById('gisSidebar');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        let scale = 1, posX = 0, posY = 0;
        let isPanning = false, startX, startY;
        let activeItem = null;
        let activeKey = "";
        let database = [];
        let allHotspots = [];

        let initialPinchDistance = null;
        let startScale = 1;
        let pinchMidX = 0, pinchMidY = 0;

        function updateTransform() {
            canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        function initView() {
            const vW = viewport.clientWidth;
            const vH = viewport.clientHeight;
            if(vW === 0 || vH === 0) return;
            
            scale = Math.max(vW / 2400, vH / 1600);
            posX = (vW / 2) - (1200 * scale);
            posY = (vH / 2) - (800 * scale);
            updateTransform();
        }

            definitions.forEach(def => {
                const pos = coordsMap[def.key];
                if (!pos) return;

                const spot = document.createElement('div');
                spot.className = def.type;
                spot.style.top = `${pos.top}%`;
                spot.style.left = `${pos.left}%`;
                spot.setAttribute('data-id', def.id);
                spot.setAttribute('data-key', def.key);
                spot.textContent = def.label ? def.label : def.id;

                spot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const item = database.find(l => l.id === def.id);
                    if(item) {
                        showLocationInfo(item);
                        smoothPanTo(item.left, item.top);
                    }
                });

                hotspotsContainer.appendChild(spot);

                database.push({
                    id: def.id,
                    key: def.key,
                    top: pos.top,
                    left: pos.left,
                    element: spot
                });

            allHotspots = hotspotsContainer.querySelectorAll('.hotspot, .sub-hotspot');
            renderRecords(database);

        function switchNextView() {
            currentViewIndex = (currentViewIndex + 1) % viewsData.length;
            closeHud();
            buildHotspotsForCurrentView();
            initView();
        }

        function smoothPanTo(targetLeftPct, targetTopPct) {
            const vW = viewport.clientWidth;
            const vH = viewport.clientHeight;
            if(vW === 0 || vH === 0) return;

            if (scale < 1.2) scale = 1.4;

            const targetPixelX = (targetLeftPct / 100) * 2400;
            const targetPixelY = (targetTopPct / 100) * 1600;

            const finalX = (vW / 2) - (targetPixelX * scale);
            const finalY = (vH / 2) - (targetPixelY * scale);

            const startX = posX;
            const startY = posY;
            const startTime = performance.now();
            const duration = 500;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);

                posX = startX + (finalX - startX) * ease;
                posY = startY + (finalY - startY) * ease;
                updateTransform();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initView);

        viewport.addEventListener('mousedown', (e) => {
            isPanning = true; 
            startX = e.clientX - posX; 
            startY = e.clientY - posY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            posX = e.clientX - startX; 
            posY = e.clientY - startY;
            updateTransform();
        });
        window.addEventListener('mouseup', () => { isPanning = false; });

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isPanning = true;
                startX = e.touches[0].clientX - posX;
                startY = e.touches[0].clientY - posY;
                initialPinchDistance = null;
            } else if (e.touches.length === 2) {
                isPanning = false;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                startScale = scale;
                
                const rect = viewport.getBoundingClientRect();
                pinchMidX = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
                pinchMidY = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
            }
        }, {passive: true});

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isPanning) {
                posX = e.touches[0].clientX - startX;
                posY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (e.touches.length === 2 && initialPinchDistance !== null) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = currentDistance / initialPinchDistance;
                let newScale = startScale * zoomFactor;
                newScale = Math.min(Math.max(newScale, 0.3), 5.0);
                
                posX = pinchMidX - (pinchMidX - posX) * (newScale / scale);
                posY = pinchMidY - (pinchMidY - posY) * (newScale / scale);
                scale = newScale;
                
                updateTransform();
            }
        }, {passive: true});

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
            if (e.touches.length === 0) isPanning = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomRate = 0.12, prevScale = scale;
            if (e.deltaY < 0) scale *= (1 + zoomRate);
            else scale /= (1 + zoomRate);
            scale = Math.min(Math.max(scale, 0.3), 5.0);
            
            const rect = viewport.getBoundingClientRect();
            const mX = e.clientX - rect.left, mY = e.clientY - rect.top;
            posX = mX - (mX - posX) * (scale / prevScale);
            posY = mY - (mY - posY) * (scale / prevScale);
            updateTransform();
        }, { passive: false });

        function zoomIn() {
            const prevScale = scale;
            scale = Math.min(scale * 1.25, 5.0);
            adjustZoomCenter(prevScale);
        }

        function zoomOut() {
            const prevScale = scale;
            scale = Math.max(scale / 1.25, 0.3);
            adjustZoomCenter(prevScale);
        }

        function adjustZoomCenter(prevScale) {
            const vW = viewport.clientWidth;
            const vH = viewport.clientHeight;
            const mX = vW / 2;
            const mY = vH / 2;
            posX = mX - (mX - posX) * (scale / prevScale);
            posY = mY - (mY - posY) * (scale / prevScale);
            updateTransform();
        }

        function locateUser() {
            const currentView = viewsData[currentViewIndex];
            const defaultPos = currentView.coords.gate_qibla;
            showUserPin(defaultPos.left, defaultPos.top);
            smoothPanTo(defaultPos.left, defaultPos.top);
        }

        function showUserPin(leftPct, topPct) {
            userPin.style.left = `${leftPct}%`;
            userPin.style.top = `${topPct}%`;
            userPin.style.display = 'flex';
        }

        viewport.addEventListener('click', (e) => {
            if(e.target === viewport || e.target.tagName === 'IMG') {
                closeHud();
            }
        });

        function closeHud() {
            allHotspots.forEach(s => s.classList.remove('active'));
            hudPanel.classList.remove('visible');
            activeItem = null;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

            gisSidebar.classList.toggle('open');
        }

        function toggleAppTheme() {
            if(document.documentElement.getAttribute('data-theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = translations[currentLang].darkMode;
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggleBtn.textContent = translations[currentLang].lightMode;
            }
        }

        function triggerAudio() {
            if ('speechSynthesis' in window && activeKey) {
                window.speechSynthesis.cancel();
                const loc = translations[currentLang].locs[activeKey];
                const speech = new SpeechSynthesisUtterance(`${loc.title}. ${loc.desc}`);
                speech.lang = currentLang === 'ar' ? 'ar-SA' : (currentLang === 'en' ? 'en-US' : 'fa-IR');
                window.speechSynthesis.speak(speech);
            }
        }

        function renderRecords(arr) {
            gisRecordsList.innerHTML = '';
            const t = translations[currentLang];
            arr.forEach(item => {
                const loc = t.locs[item.key];
                if(!loc) return;
                const card = document.createElement('div');
                card.className = 'record-card';
                
                card.innerHTML = `
                    <div class="record-badge">${item.id}</div>
                    <div class="record-details">
                        <h4>${loc.title}</h4>
                        <span>${loc.desc}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    showLocationInfo(item);
                    smoothPanTo(item.left, item.top);
                    toggleSidebar();
                });
                gisRecordsList.appendChild(card);
            });
        }

        function showLocationInfo(item) {
            allHotspots.forEach(s => s.classList.remove('active'));
            item.element.classList.add('active');

            activeItem = item;
            activeKey = item.key;
            const t = translations[currentLang];
            const loc = t.locs[item.key];

            hudTitle.textContent = loc.title;
            hudDescription.textContent = loc.desc;

            hudPanel.classList.add('visible');
        }

        gisSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const t = translations[currentLang];
            const res = database.filter(i => {
                const l = t.locs[i.key];
                return l.title.toLowerCase().includes(query) || l.desc.toLowerCase().includes(query);
            });
            renderRecords(res);
        });
    </script>
</body>
</html>
